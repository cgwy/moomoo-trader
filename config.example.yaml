# Copy to config.yaml and edit. config.yaml is gitignored — never commit it.

# Where daily bars come from:
#   "yahoo" — Yahoo Finance chart API. Free, no login, no key. (default)
#   "opend" — your own logged-in OpenD (moomoo gateway). Needs the moomoo app
#             API questionnaire done once, and OpenD running on this machine.
data_source: "yahoo"

opend:
  host: "127.0.0.1"
  port: 11111

# futu-api US market symbol format: US.<ticker>
symbols:
  - US.VOO
  - US.SOXX
  - US.AMZN
  - US.GOOGL
  - US.MSFT

strategy:
  # "breakout" (default): low-frequency confluence — 100d breakout + above
  #   SMA200 + ADX trend strength, with 100d-low / SMA200 /
  #   ATR trailing-stop exits. ~1-3 round trips/year per ticker (see backtest).
  # "classic": MA golden/death cross + RSI zone entries (more frequent).
  preset: "breakout"
  use_ma_cross: true
  ma_fast: 5
  ma_slow: 20
  use_rsi: true
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  breakout:
    breakout_n: 100
    trend_sma: 200
    volume_n: 20
    adx_period: 14
    adx_min: 20.0
    atr_period: 14
    atr_mult: 2.5
    cooldown_days: 60
    state_file: "positions.json"   # live position store (gitignored)
    # Conviction layer (bot/conviction.py): insider Form 4 (SEC EDGAR, free,
    # no key) vetoes entries on material net insider selling; short interest
    # (Nasdaq, free) is shown as positioning context on tickets. Fail-open:
    # if a source is unreachable, the signal still fires and the ticket notes
    # the missing data.
    insider:
      window_days: 90
      veto_on_net_selling: true
      min_net_sell_usd: 1000000   # routine diversification sales don't veto

scan:
  # Minutes between full watchlist scans.
  poll_interval_minutes: 60
  # How far back to pull daily bars. The breakout preset needs 200+ bars for
  # SMA(200); 400 is a comfortable warmup for both presets.
  history_days: 400

notify:
  log_file: "signals.log"
